name: remote-secret-presence-v2

on:
  push:
    branches:
      - codex/ch01-motion-comic-h3-pack
    paths:
      - .github/workflows/remote-secret-presence-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
      ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
      ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
      ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
      TUNNEL_HOST: ${{ secrets.TUNNEL_HOST }}
      TUNNEL_PORT: ${{ secrets.TUNNEL_PORT }}
      TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
      DEVSPACE_URL: ${{ secrets.DEVSPACE_URL }}
      DEVSPACE_HOST: ${{ secrets.DEVSPACE_HOST }}
      DEVSPACE_TOKEN: ${{ secrets.DEVSPACE_TOKEN }}
      DEVSPACE_API_KEY: ${{ secrets.DEVSPACE_API_KEY }}
      DEVSPACE_PASSWORD: ${{ secrets.DEVSPACE_PASSWORD }}
      CANENGINE_URL: ${{ secrets.CANENGINE_URL }}
      CANENGINE_TOKEN: ${{ secrets.CANENGINE_TOKEN }}
      CANENGINE_API_KEY: ${{ secrets.CANENGINE_API_KEY }}
      MCP_URL: ${{ secrets.MCP_URL }}
      MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
      MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
      MY_AGENT_USER: ${{ secrets.MY_AGENT_USER }}
      MY_AGENT_PASS: ${{ secrets.MY_AGENT_PASS }}
      MYAGENT_USERNAME: ${{ secrets.MYAGENT_USERNAME }}
      MYAGENT_PASSWORD: ${{ secrets.MYAGENT_PASSWORD }}
      AUTHELIA_USER: ${{ secrets.AUTHELIA_USER }}
      AUTHELIA_PASS: ${{ secrets.AUTHELIA_PASS }}
      AUTHELIA_SESSION: ${{ secrets.AUTHELIA_SESSION }}
      COMFYUI_URL: ${{ secrets.COMFYUI_URL }}
      COMFYUI_TOKEN: ${{ secrets.COMFYUI_TOKEN }}
      COMFYUI_API_KEY: ${{ secrets.COMFYUI_API_KEY }}
      COMFY_URL: ${{ secrets.COMFY_URL }}
      COMFY_API_KEY: ${{ secrets.COMFY_API_KEY }}
      COMFY_HOST: ${{ secrets.COMFY_HOST }}
      COMFY_PORT: ${{ secrets.COMFY_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ch01-motion-comic-h3-pack

      - name: Record only presence, never values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/probe
          vars=(
            SSH_HOST SSH_PORT SSH_USER SSH_USERNAME SSH_PRIVATE_KEY SSH_KEY SSH_PASSWORD
            ALIYUN_HOST ALIYUN_PORT ALIYUN_USER ALIYUN_USERNAME ALIYUN_SSH_KEY ALIYUN_PASSWORD
            TUNNEL_HOST TUNNEL_PORT TUNNEL_TOKEN
            DEVSPACE_URL DEVSPACE_HOST DEVSPACE_TOKEN DEVSPACE_API_KEY DEVSPACE_PASSWORD
            CANENGINE_URL CANENGINE_TOKEN CANENGINE_API_KEY MCP_URL MCP_TOKEN MCP_API_KEY
            MY_AGENT_USER MY_AGENT_PASS MYAGENT_USERNAME MYAGENT_PASSWORD AUTHELIA_USER AUTHELIA_PASS AUTHELIA_SESSION
            COMFYUI_URL COMFYUI_TOKEN COMFYUI_API_KEY COMFY_URL COMFY_API_KEY COMFY_HOST COMFY_PORT
          )
          {
            echo '# Remote execution secret presence v2'
            echo
            echo "- UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            for name in "${vars[@]}"; do
              if [[ -n "${!name:-}" ]]; then echo "- $name: SET"; else echo "- $name: UNSET"; fi
            done
          } > .github/probe/remote-secret-presence-v2.md

      - name: Commit sanitized presence report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QingCS Remote Probe'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/probe/remote-secret-presence-v2.md
          git commit -m 'ci: record remote execution secret presence v2' || exit 0
          git push origin HEAD:codex/ch01-motion-comic-h3-pack
