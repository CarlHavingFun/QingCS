name: comfy-public-probe

on:
  push:
    branches:
      - codex/ch01-motion-comic-h3-pack
    paths:
      - .github/workflows/comfy-public-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ch01-motion-comic-h3-pack

      - name: Probe ComfyUI public bridge
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .github/probe
          base='https://my-agent.com.cn/comfy'
          report='.github/probe/comfy-public-probe.md'
          tmpdir="$(mktemp -d)"
          {
            echo '# ComfyUI public bridge probe'
            echo
            echo "- UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Base: \`$base\`"
            echo
            echo '## DNS'
            echo '```text'
            getent ahosts my-agent.com.cn 2>&1 || true
            echo '```'
            echo
            echo '## Endpoints'
          } > "$report"

          for endpoint in system_stats queue history object_info; do
            url="$base/$endpoint"
            body="$tmpdir/${endpoint}.body"
            initial_headers="$tmpdir/${endpoint}.initial.headers"
            final_headers="$tmpdir/${endpoint}.final.headers"
            initial_code="$(curl -k -sS --connect-timeout 12 --max-time 40 \
              -D "$initial_headers" -o /dev/null -w '%{http_code}' \
              "$url" 2>"$tmpdir/${endpoint}.initial.err" || true)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' "$initial_headers" 2>/dev/null || true)"
            meta="$(curl -k -L -sS --connect-timeout 12 --max-time 50 \
              -D "$final_headers" -o "$body" \
              -w '%{http_code}|%{url_effective}|%{content_type}' \
              "$url" 2>"$tmpdir/${endpoint}.err" || true)"
            IFS='|' read -r final_code effective ctype <<< "$meta"
            effective="${effective%%\?*}"
            location="${location%%\?*}"
            bytes="$(wc -c < "$body" 2>/dev/null || echo 0)"
            {
              echo
              echo "### \`/$endpoint\`"
              echo "- Initial HTTP: \`${initial_code:-curl_failed}\`"
              echo "- Redirect: \`${location:-none}\`"
              echo "- Final HTTP: \`${final_code:-curl_failed}\`"
              echo "- Final URL: \`${effective:-unknown}\`"
              echo "- Content-Type: \`${ctype:-unknown}\`"
              echo "- Bytes: \`$bytes\`"
              if [[ -s "$tmpdir/${endpoint}.err" ]]; then
                echo '- Curl error:'
                echo '```text'
                sed -n '1,8p' "$tmpdir/${endpoint}.err"
                echo '```'
              fi
            } >> "$report"

            if [[ "$final_code" == '200' && "$ctype" == *json* && "$endpoint" == 'system_stats' ]]; then
              echo '- Sanitized response:' >> "$report"
              echo '```json' >> "$report"
              jq '{system: {os: .system.os, comfyui_version: .system.comfyui_version, python_version: .system.python_version, pytorch_version: .system.pytorch_version}, devices: [.devices[]? | {name, type, vram_total, vram_free, torch_vram_total, torch_vram_free}]}' "$body" 2>/dev/null >> "$report" || head -c 1200 "$body" >> "$report"
              echo >> "$report"
              echo '```' >> "$report"
            fi

            if [[ "$final_code" == '200' && "$ctype" == *json* && "$endpoint" == 'object_info' ]]; then
              echo '- Relevant node types:' >> "$report"
              echo '```json' >> "$report"
              jq 'keys | map(select(test("MiniMaxH3|LoadImage|SaveVideo|CreateVideo|VAEDecodeAudio")))' "$body" 2>/dev/null >> "$report" || true
              echo '```' >> "$report"
            fi

            if [[ "$endpoint" == 'system_stats' && "$final_code" == '200' && "$ctype" == *html* && "$effective" == *'/auth/'* ]]; then
              echo >> "$report"
              echo '## Authentication page structure (values redacted)' >> "$report"
              echo '```text' >> "$report"
              python - "$body" <<'PY' >> "$report"
          import re
          import sys
          from html.parser import HTMLParser

          class AuthParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms = []
                  self.inputs = []
                  self.buttons = []
                  self.scripts = []
                  self.text = []
                  self._button = False
                  self._button_text = []
                  self._script = False
                  self._script_text = []

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag == 'form':
                      self.forms.append({k: data.get(k) for k in ('method', 'action')})
                  elif tag == 'input':
                      self.inputs.append({k: data.get(k) for k in ('type', 'name', 'id', 'placeholder', 'autocomplete')})
                  elif tag == 'button':
                      self._button = True
                      self._button_text = []
                  elif tag == 'script':
                      self._script = True
                      self._script_text = []
                      if data.get('src'):
                          self.scripts.append('src=' + data['src'])

              def handle_endtag(self, tag):
                  if tag == 'button' and self._button:
                      self.buttons.append(' '.join(''.join(self._button_text).split()))
                      self._button = False
                  elif tag == 'script' and self._script:
                      code = ''.join(self._script_text)
                      for pat in (r"fetch\(([^\n;]{1,240})", r"axios\.([a-z]+)\(([^\n;]{1,240})", r"location\.[a-z]+\s*=\s*([^\n;]{1,240})"):
                          for m in re.finditer(pat, code):
                              item = m.group(0)
                              item = re.sub(r"(['\"])([^'\"]{20,})\1", r"\1<redacted-or-path>\1", item)
                              self.scripts.append(item)
                      self._script = False

              def handle_data(self, data):
                  if self._button:
                      self._button_text.append(data)
                  if self._script:
                      self._script_text.append(data)
                  else:
                      stripped = ' '.join(data.split())
                      if stripped:
                          self.text.append(stripped)

          p = AuthParser()
          p.feed(open(sys.argv[1], encoding='utf-8', errors='replace').read())
          print('forms=', p.forms)
          print('inputs=', p.inputs)
          print('buttons=', p.buttons)
          print('visible_text=', ' | '.join(p.text)[:1200])
          print('script_hints=', p.scripts[:20])
          PY
              echo '```' >> "$report"
            fi
          done

      - name: Commit sanitized probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QingCS Comfy Probe'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/probe/comfy-public-probe.md
          git commit -m 'ci: record ComfyUI bridge probe' || exit 0
          git push origin HEAD:codex/ch01-motion-comic-h3-pack
