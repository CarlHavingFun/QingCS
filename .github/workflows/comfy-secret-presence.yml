name: comfy-secret-presence

on:
  push:
    branches:
      - codex/ch01-motion-comic-h3-pack
    paths:
      - .github/workflows/comfy-secret-presence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MY_AGENT_USERNAME: ${{ secrets.MY_AGENT_USERNAME }}
      MY_AGENT_PASSWORD: ${{ secrets.MY_AGENT_PASSWORD }}
      AUTHELIA_USERNAME: ${{ secrets.AUTHELIA_USERNAME }}
      AUTHELIA_PASSWORD: ${{ secrets.AUTHELIA_PASSWORD }}
      DEVSPACE_USERNAME: ${{ secrets.DEVSPACE_USERNAME }}
      DEVSPACE_PASSWORD: ${{ secrets.DEVSPACE_PASSWORD }}
      COMFY_USERNAME: ${{ secrets.COMFY_USERNAME }}
      COMFY_PASSWORD: ${{ secrets.COMFY_PASSWORD }}
      CANENGINE_USERNAME: ${{ secrets.CANENGINE_USERNAME }}
      CANENGINE_PASSWORD: ${{ secrets.CANENGINE_PASSWORD }}
      MY_AGENT_TOKEN: ${{ secrets.MY_AGENT_TOKEN }}
      AUTHELIA_TOKEN: ${{ secrets.AUTHELIA_TOKEN }}
      COMFY_TOKEN: ${{ secrets.COMFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ch01-motion-comic-h3-pack

      - name: Record only secret presence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/probe
          {
            echo '# Comfy bridge secret presence'
            echo
            echo "- UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            for name in \
              MY_AGENT_USERNAME MY_AGENT_PASSWORD \
              AUTHELIA_USERNAME AUTHELIA_PASSWORD \
              DEVSPACE_USERNAME DEVSPACE_PASSWORD \
              COMFY_USERNAME COMFY_PASSWORD \
              CANENGINE_USERNAME CANENGINE_PASSWORD \
              MY_AGENT_TOKEN AUTHELIA_TOKEN COMFY_TOKEN; do
              if [[ -n "${!name:-}" ]]; then
                echo "- $name: SET"
              else
                echo "- $name: UNSET"
              fi
            done
          } > .github/probe/comfy-secret-presence.md

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QingCS Comfy Probe'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/probe/comfy-secret-presence.md
          git commit -m 'ci: record Comfy bridge secret presence' || exit 0
          git push origin HEAD:codex/ch01-motion-comic-h3-pack
