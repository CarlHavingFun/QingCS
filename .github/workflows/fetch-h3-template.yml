name: Fetch official ComfyUI MiniMax H3 template

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fetch-h3-template.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download official workflow template
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/video_minimax_h3_i2v.json \
            --output video_minimax_h3_i2v.json
          python -m json.tool video_minimax_h3_i2v.json >/dev/null
      - name: Upload template
        uses: actions/upload-artifact@v4
        with:
          name: official-comfyui-minimax-h3-template
          path: video_minimax_h3_i2v.json
          retention-days: 1
